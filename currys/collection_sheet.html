<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Goods Collection Sheet - Currys (A5 on A4 Landscape)</title>
    <style>
        @font-face {
            font-family: 'Currys Sans';
            src: url('Currys sans.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --purple-main: #4d2d7c;
            --purple-light: #eadef0;
            --purple-header: #3b2260;
            --border-color: #3b2260;
        }

        @page {
            size: A4 landscape;
            margin: 0mm;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
            background-color: #ffffff;
            font-family: 'Currys Sans', Arial, Helvetica, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            display: flex;
            justify-content: flex-start;
            padding: 10px;
            box-sizing: border-box;
            background-color: #f4f4f9;
        }

        .form-container {
            width: 148mm;
            height: 210mm;
            background: #ffffff;
            padding: 6mm 8mm;
            box-sizing: border-box;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .form-container form {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .header-section h1 {
            color: var(--purple-main);
            font-size: 25px;
            margin: 0;
            font-weight: bold;
            text-align: left;
        }

        .logo {
            background-color: var(--purple-main) !important;
            color: #ffffff !important;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            text-transform: lowercase;
            text-align: center;
            -webkit-print-color-adjust: exact;
        }

        /* Top Meta Information */
        .meta-group {
            background-color: var(--purple-light) !important;
            padding: 5px 8px;
            border-radius: 2px;
            margin-bottom: 5px;
            -webkit-print-color-adjust: exact;
        }

        .meta-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 3px;
        }

        .meta-row:last-child {
            margin-bottom: 0;
        }

        .meta-row label {
            width: 22%;
            font-size: 8px;
            font-weight: bold;
            color: var(--purple-main);
            text-transform: uppercase;
            text-align: right;
            padding-right: 8px;
            box-sizing: border-box;
            line-height: 1.1;
        }

        .meta-row input {
            width: 78%;
            padding: 2px 4px;
            border: 1px solid #ccc;
            border-radius: 0;
            font-size: 10px;
            height: 16px;
            text-align: left;
            box-sizing: border-box;
            background-color: #ffffff;
            font-family: 'Currys Sans', Arial, sans-serif;
        }

        /* Tables Setup */
        :root {
            --row-h: 6.39mm;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 6px;
            table-layout: fixed;
        }

        table tr {
            height: var(--row-h);
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 1px 2px;
            height: var(--row-h);
            box-sizing: border-box;
            vertical-align: middle;
        }

        th {
            background-color: var(--purple-main) !important;
            color: #ffffff !important;
            font-size: 8px;
            text-transform: uppercase;
            font-weight: bold;
            padding: 3px 2px;
            text-align: center;
            -webkit-print-color-adjust: exact;
        }

        td input {
            width: 100%;
            border: none;
            outline: none;
            padding: 1px;
            font-size: 9px;
            box-sizing: border-box;
            background: transparent;
            height: 100%;
            text-align: left;
            font-family: 'Currys Sans', Arial, sans-serif;
        }

        .tote-input-cell {
            display: flex;
            align-items: center;
            text-align: left;
            height: 100%;
        }

        .tote-input-cell span {
            font-weight: bold;
            font-size: 8px;
            color: var(--purple-main);
            margin-right: 2px;
        }

        /* Signatures Section */
        .signatures-table th {
            width: 50%;
            text-align: center;
        }

        .signatures-table td.label-col {
            width: 50px;
            font-size: 8px;
            font-weight: bold;
            color: var(--purple-main);
            background-color: #f9f9f9;
            text-transform: uppercase;
            text-align: left;
        }

        .signatures-table tbody td[colspan] table {
            margin: 0;
        }

        /* Footer Metadata */
        .footer-info {
            font-size: 8px;
            color: #333;
            line-height: 1.2;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 2px;
            text-align: left;
        }

        .print-btn {
            position: fixed;
            top: 10px;
            right: 20px;
            margin: 0;
            padding: 8px 16px;
            background-color: var(--purple-main);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Currys Sans', Arial, sans-serif;
            z-index: 1000;
        }

        @media print {
            .print-btn {
                display: none !important;
            }
        }
        @media print {
            html, body {
                width: 297mm !important;
                height: 210mm !important;
                max-width: 297mm !important;
                max-height: 210mm !important;
                padding: 0 !important;
                margin: 0 !important;
                background: white !important;
                overflow: hidden !important;
            }
            .form-container {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                box-shadow: none !important;
                padding: 6mm 8mm !important;
                width: 145mm !important;
                height: 205mm !important;
                max-height: 205mm !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
                float: none !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
                break-after: avoid !important;
                break-inside: avoid !important;
            }
            :root {
                --row-h: 6.25mm !important;
            }
        }
    </style>
</head>
<body>

<button type="button" class="print-btn" onclick="window.print();">Print</button>
<div class="form-container">
    <form id="collection-form" onkeydown="return disableFormSubmit(event);">
        <!-- Header -->
        <div class="header-section">
            <h1>Goods collection sheet</h1>
            <div class="logo">currys</div>
        </div>

        <!-- Date & Branch Info -->
        <div class="meta-group">
            <div class="meta-row">
                <label for="date">DATE</label>
                <input type="date" id="date" name="date" class="nav-input">
            </div>
            <div class="meta-row">
                <label for="branch-number">BRANCH<br>NUMBER</label>
                <input type="text" id="branch-number" name="branch_number" class="nav-input">
            </div>
            <div class="meta-row">
                <label for="branch-name">BRANCH<br>NAME</label>
                <input type="text" id="branch-name" name="branch_name" class="nav-input">
            </div>
        </div>

        <!-- Number of Boxes -->
        <div class="meta-group">
            <div class="meta-row">
                <label for="number-of-boxes">NUMBER<br>OF BOXES</label>
                <input type="number" id="number-of-boxes" name="number_of_boxes" min="0" class="nav-input">
            </div>
        </div>

        <!-- Consignment Table -->
        <table>
            <thead>
                <tr>
                    <th>Consignment Number</th>
                    <th>Type of Return</th>
                    <th>Tote Seal 1</th>
                    <th>Tote Seal 2</th>
                    <th>Tote Number</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (var i = 0; i < 10; i++) {
                        document.write('<tr>' +
                            '<td><input type="text" name="consignment_number[]" class="nav-input"></td>' +
                            '<td><input type="text" name="type_of_return[]" class="nav-input"></td>' +
                            '<td><input type="text" name="tote_seal_1[]" class="nav-input"></td>' +
                            '<td><input type="text" name="tote_seal_2[]" class="nav-input"></td>' +
                            '<td>' +
                                '<div class="tote-input-cell">' +
                                    '<span>T:</span>' +
                                    '<input type="text" name="tote_number[]" class="nav-input">' +
                                '</div>' +
                            '</td>' +
                        '</tr>');
                    }
                </script>
            </tbody>
        </table>

        <!-- Paperwork & Batch Table -->
        <table>
            <thead>
                <tr>
                    <th style="width: 33.33%;">Paperwork</th>
                    <th style="width: 33.33%;">Barcode Number</th>
                    <th style="width: 33.33%;">Batch Number</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (var j = 0; j < 5; j++) {
                        document.write('<tr>' +
                            '<td><input type="text" name="paperwork[]" class="nav-input"></td>' +
                            '<td><input type="text" name="barcode_number[]" class="nav-input"></td>' +
                            '<td><input type="text" name="batch_number[]" class="nav-input"></td>' +
                        '</tr>');
                    }
                </script>
                <tr>
                    <td colspan="3">
                        <div style="display: flex; align-items: center; padding: 1px; width: 100%;">
                            <label for="qty-envelopes" style="font-size: 8px; font-weight: bold; color: var(--purple-main); text-transform: uppercase; margin-right: 6px; text-align: left;">Quantity of Envelopes</label>
                            <input type="number" id="qty-envelopes" name="quantity_of_envelopes" min="0" style="flex: 1;" class="nav-input">
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Signatures Table -->
        <table class="signatures-table">
            <thead>
                <tr>
                    <th>Store Rep</th>
                    <th>Collected By</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="2" style="padding: 0;">
                        <table style="width: 100%; margin: 0; border: none;">
                            <tr>
                                <td class="label-col" style="border-left: none; border-top: none;">Sign</td>
                                <td style="width: 40%; border-top: none;"><input type="text" name="store_rep_sign" class="nav-input"></td>
                                <td class="label-col" style="border-top: none;">Sign</td>
                                <td style="width: 40%; border-right: none; border-top: none;"><input type="text" name="collected_by_sign" class="nav-input"></td>
                            </tr>
                            <tr>
                                <td class="label-col" style="border-left: none;">Print</td>
                                <td><input type="text" name="store_rep_print" class="nav-input"></td>
                                <td class="label-col">Print</td>
                                <td style="border-right: none;"><input type="text" name="collected_by_print" class="nav-input"></td>
                            </tr>
                            <tr>
                                <td class="label-col" style="border-left: none; border-bottom: none;">Company</td>
                                <td style="border-bottom: none;"><input type="text" id="store-rep-company" name="store_rep_company" class="nav-input"></td>
                                <td style="border-bottom: none; border-right: none;" colspan="2"></td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Footer Info -->
        <div class="footer-info">
            HH CODE: 930008388<br>
            CPW CODE: 930036206<br>
            CPW PLU: ZZVMGOODSCOLLEC<br>
            TN1999
        </div>
    </form>
</div>

<script>
    function disableFormSubmit(e) {
        var key = e.keyCode || e.which;
        if (key === 13) {
            return false;
        }
    }

    window.onload = function() {
        var dateInput = document.getElementById('date');
        if (dateInput) {
            var now = new Date();
            var day = ("0" + now.getDate()).slice(-2);
            var month = ("0" + (now.getMonth() + 1)).slice(-2);
            var today = now.getFullYear() + "-" + month + "-" + day;
            dateInput.value = today;
        }

        var fieldsToPersist = [
            { id: 'branch-number', key: 'currys_branch_number' },
            { id: 'branch-name', key: 'currys_branch_name' },
            { id: 'store-rep-company', key: 'currys_company' }
        ];

        function bindEvent(element, eventName, handler) {
            if (element.addEventListener) {
                element.addEventListener(eventName, handler, false);
            } else if (element.attachEvent) {
                element.attachEvent('on' + eventName, handler);
            }
        }

        if (window.localStorage) {
            for (var k = 0; k < fieldsToPersist.length; k++) {
                (function(item) {
                    var inputEl = document.getElementById(item.id);
                    if (inputEl) {
                        var savedVal = localStorage.getItem(item.key);
                        if (savedVal !== null) {
                            inputEl.value = savedVal;
                        }
                        bindEvent(inputEl, 'keyup', function() {
                            localStorage.setItem(item.key, inputEl.value);
                        });
                        bindEvent(inputEl, 'change', function() {
                            localStorage.setItem(item.key, inputEl.value);
                        });
                    }
                })(fieldsToPersist[k]);
            }
        }

        var inputs = document.getElementsByClassName('nav-input');
        for (var n = 0; n < inputs.length; n++) {
            (function(index) {
                bindEvent(inputs[index], 'keydown', function(e) {
                    var keyCode = e.keyCode || e.which;
                    if (keyCode === 13) {
                        if (e.preventDefault) {
                            e.preventDefault();
                        } else {
                            e.returnValue = false;
                        }
                        if (index + 1 < inputs.length) {
                            inputs[index + 1].focus();
                            if (inputs[index + 1].select) {
                                inputs[index + 1].select();
                            }
                        }
                    }
                });
            })(n);
        }
    };
</script>

</body>
</html>
