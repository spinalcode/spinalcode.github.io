<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Display</title>
<script src="tesseract.min.js"></script>
<script src="JsBarcode.all.min.js"></script>
<style>
  body {
    align-items: center;
    justify-content: center;
    background-color: #CAE7E6;
    position: relative;
    display: flex;
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }

  .container1 {
    position: relative;
    border: 2px solid #4C12A1;
    text-align: center;
    background-color: #B8D2F3;
    border-radius: 20px;
    padding: 20px;
    margin-top: 50px;
  }

  .h1-container { margin-top: -40px; }

  .container1 h1 {
    display: inline-block;
    border: 2px solid #4C12A1;
    border-radius: 10px;
    padding: 5px 20px;
    text-align: center;
    background-color: #FFFFFF;
    color: #4C12A1;
    font-size: 1.4rem;
    margin: 0;
  }

  button {
    border: 1px solid #4C12A1;
    border-radius: 50px;
    padding: 5px;
    width: 100px;
    text-align: center;
    background-color: #4C12A1;
    color: #FFF;
    cursor: pointer;
  }

  #status {
    color: #4C12A1;
    font-size: 0.9rem;
    margin-top: 10px;
    min-height: 1.2em;
  }

  #result {
    border: 2px solid #4C12A1;
    border-radius: 5px;
    padding: 5px;
    text-align: center;
    background-color: #FFFFFF;
    color: #4C12A1;
    width: 400px;
    max-width: 80vw;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin: 10px auto 0;
    min-height: 1.4em;
    display: none;
  }

  #barcodeBox {
    border: 2px solid #4C12A1;
    border-radius: 5px;
    padding: 10px;
    text-align: center;
    background-color: #FFFFFF;
    color: #000000;
    width: 90vw;
    max-width: 900px;
    margin: 10px auto 0;
    display: none;
    align-items: center;
    justify-content: center;
    min-height: 100px;
  }

  #barcode { width: 100%; height: auto; display: block; }

  #scanner-container {
    display: none;
    border-radius: 10px;
    margin-top: 10px;
  }
  #scanner-container.open {
    display: block;
    border: 2px solid #4C12A1;
  }

  video { max-width: 100%; width: 100%; height: 120px; object-fit: cover; border-radius: 8px; display: block; }
  canvas { max-width: 100%; border-radius: 8px; display: none; }

  #toggle-button, .button {
    width: 300px;
    max-width: 80vw;
    height: 60px;
    font-size: 1.3rem;
    margin-top: 20px;
  }

  progress { width: 100%; margin-top: 0.5rem; display: none; }

  #barcodeNote { font-size: 0.75rem; opacity: 0.7; margin-top: 0.25rem; }

  #historyBox {
    width: 90vw;
    max-width: 900px;
    margin: 20px auto 0;
    display: none;
  }
  #historyBox.has-items { display: block; }

  #historyList { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }

  .history-item {
    border: 2px solid #4C12A1;
    border-radius: 8px;
    background-color: #FFFFFF;
    color: #4C12A1;
    padding: 12px;
    font-size: 1.1rem;
    letter-spacing: 0.03em;
    touch-action: pan-y;
    user-select: none;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="container1">
    <div class="h1-container"><h1>Barcode Display</h1></div>

    <div id="result"></div>
    <div id="barcodeBox"><svg id="barcode"></svg></div>
    <div id="barcodeNote"></div>
    <progress id="progress" value="0" max="1"></progress>
    <div id="status">Tap Scan Voucher to start.</div>

    <div id="scanner-container">
      <video id="video" autoplay playsinline></video>
      <canvas id="preview"></canvas>
    </div>

    <br>
    <button id="toggle-button">Scan Voucher</button>

    <div id="historyBox">
      <div id="historyList"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const progressEl = document.getElementById('progress');
const barcodeEl = document.getElementById('barcode');
const barcodeBoxEl = document.getElementById('barcodeBox');
const barcodeNoteEl = document.getElementById('barcodeNote');
const historyBoxEl = document.getElementById('historyBox');
const historyListEl = document.getElementById('historyList');

const camBtn = document.getElementById('toggle-button');
const scannerContainer = document.getElementById('scanner-container');
const video = document.getElementById('video');
let stream = null;
let scanning = false;

const HISTORY_KEY = 'voucherHistory';
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}
function saveHistory(arr) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); } catch {}
}
function addToHistory(code) {
  let h = loadHistory().filter(c => c !== code);
  h.unshift(code);
  if (h.length > 10) h = h.slice(0, 10);
  saveHistory(h);
  renderHistory();
}
function removeFromHistory(code) {
  saveHistory(loadHistory().filter(c => c !== code));
  renderHistory();
}

function renderHistory() {
  const items = loadHistory();
  historyListEl.innerHTML = '';
  historyBoxEl.classList.toggle('has-items', items.length > 0);
  items.forEach(code => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.textContent = code;
    attachSwipe(item, code);
    historyListEl.appendChild(item);
  });
}

function attachSwipe(el, code) {
  let startX = 0, dx = 0, dragging = false;
  el.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; dx = 0;
    el.style.transition = 'none';
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    el.style.transform = `translateX(${dx}px)`;
    el.style.opacity = String(1 - Math.min(Math.abs(dx) / 150, 0.85));
  });
  el.addEventListener('pointerup', () => {
    dragging = false;
    el.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
    if (Math.abs(dx) > 80) {
      el.style.transform = `translateX(${dx > 0 ? 500 : -500}px)`;
      el.style.opacity = '0';
      setTimeout(() => removeFromHistory(code), 180);
    } else if (Math.abs(dx) < 8) {
      el.style.transform = 'translateX(0)';
      el.style.opacity = '1';
      showCode(code);
    } else {
      el.style.transform = 'translateX(0)';
      el.style.opacity = '1';
    }
  });
}

function showCode(code) {
  const barcodeValue = 'DSG16' + code;
  resultEl.textContent = code;
  resultEl.style.display = 'block';
  try {
    JsBarcode(barcodeEl, barcodeValue, { format: 'CODE128', displayValue: true, width: 2, height: 60, fontSize: 14 });
    const w = barcodeEl.getAttribute('width');
    const h = barcodeEl.getAttribute('height');
    barcodeEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
    barcodeEl.removeAttribute('width');
    barcodeEl.removeAttribute('height');
    barcodeBoxEl.style.display = 'flex';
  } catch (bcErr) {
    barcodeBoxEl.style.display = 'none';
    barcodeNoteEl.textContent = 'Could not render barcode: ' + bcErr.message;
  }
}

renderHistory();

async function startScanning() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    scannerContainer.classList.add('open');
    scannerContainer.style.display = 'block';
    canvas.style.display = 'none';
    video.style.display = 'block';
    statusEl.textContent = 'Position the code, then tap Capture.';
    camBtn.textContent = 'Capture';
    scanning = true;
  } catch (err) {
    statusEl.textContent = 'Camera access failed: ' + (err && err.message ? err.message : 'permission denied');
  }
}

camBtn.addEventListener('click', async () => {
  if (!scanning) {
    await startScanning();
  } else {
    const boxW = video.clientWidth;
    const boxH = video.clientHeight;
    const videoRatio = video.videoWidth / video.videoHeight;
    const boxRatio = boxW / boxH;
    let sx, sy, sw, sh;
    if (videoRatio > boxRatio) {
      sh = video.videoHeight;
      sw = sh * boxRatio;
      sx = (video.videoWidth - sw) / 2;
      sy = 0;
    } else {
      sw = video.videoWidth;
      sh = sw / boxRatio;
      sx = 0;
      sy = (video.videoHeight - sh) / 2;
    }
    const maxW = 400;
    canvas.width = maxW;
    canvas.height = maxW / boxRatio;
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    canvas.style.display = 'block';
    video.style.display = 'none';
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    scannerContainer.classList.remove('open');
    camBtn.textContent = 'Scan Voucher';
    scanning = false;
    canvas.toBlob(runOcr, 'image/png');
  }
});

async function runOcr(blob) {
    resultEl.textContent = '';
    resultEl.style.display = 'none';
    barcodeBoxEl.style.display = 'none';
    statusEl.textContent = 'Reading code locally…';
    progressEl.style.display = 'block';
    progressEl.value = 0;

    try {
      const { data } = await Tesseract.recognize(blob, 'eng', {
        workerPath: 'worker.min.js',
        corePath: 'tesseract-core-lstm.wasm.js',
        langPath: '.',
        cacheMethod: 'none',
        gzip: true,
        logger: (m) => {
          if (m.status === 'recognizing text') {
            progressEl.value = m.progress;
            statusEl.textContent = 'Reading… ' + Math.round(m.progress * 100) + '%';
          } else {
            statusEl.textContent = m.status;
          }
        },
        tessedit_char_whitelist: '0123456789'
      });

      // Grab the longest run of digits found (the voucher code)
      const allDigits = data.text.match(/\d{6,}/g) || [];
      const matches = allDigits.filter(d => d.length === 15);
      progressEl.style.display = 'none';

      if (matches.length) {
        const code = matches[0];
        resultEl.style.display = 'block';
        statusEl.textContent = '';
        canvas.style.display = 'none';
        showCode(code);
        addToHistory(code);
      } else {
        statusEl.textContent = 'No code found — rescanning…';
        barcodeNoteEl.textContent = '';
        setTimeout(startScanning, 800);
      }
    } catch (err) {
      progressEl.style.display = 'none';
      statusEl.textContent = 'OCR failed: ' + (err && err.message ? err.message : 'unknown error');
    }
}

</script>
</body>
